services:
  redis:
    image: redis:7-alpine
    container_name: shopapi-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: shopapi-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: shopapi-mongo
    ports:
      - "27017:27017"
    restart: unless-stopped
